name: Build AoM PKG
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: mayo2853/ps3dev-latest:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          chmod +x waf
          ./waf configure --ps3 --gamedir=aom --static-linking=filesystem_stdio,ref_soft,ref_gl,menu,server,client
          ./waf build
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: aom-pkg
          path: build_aom/engine/pkg/EBOOT.pkg
